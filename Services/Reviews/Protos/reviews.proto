syntax = "proto3";
option csharp_namespace = "TrailRent.Reviews.Grpc";
package reviews;
service ReviewsService { rpc GetForProducts(GetForProductsRequest) returns (ReviewsReply); }
message GetForProductsRequest { repeated int32 product_ids = 1; }
message ReviewReply { string id = 1; int32 product_id = 2; string author = 3; int32 rating = 4; string text = 5; }
message ReviewsReply { repeated ReviewReply reviews = 1; }
