syntax = "proto3";
option csharp_namespace = "TrailRent.Orders.Grpc";
package orders;
service OrdersService { rpc GetOrder(GetOrderRequest) returns (OrderReply); }
message GetOrderRequest { int64 id = 1; }
message OrderItem { int32 product_id = 1; int32 quantity = 2; }
message OrderReply { int64 id = 1; string status = 2; repeated OrderItem items = 3; }
